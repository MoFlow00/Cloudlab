name: Cloud Desktop

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "مدة الجلسة"
        required: true
        type: choice
        options:
          - "1h"
          - "3h"
          - "5h"
        default: "3h"

      resolution:
        description: "دقة الشاشة"
        required: true
        type: choice
        options:
          - "1280x720"
          - "1600x900"
          - "1920x1080"
        default: "1600x900"

permissions:
  contents: read

jobs:
  desktop:
    name: Cloud Desktop
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      DISPLAY: ":99"

    steps:
      - name: Install desktop packages
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xvfb \
            x11-utils \
            x11vnc \
            openbox \
            tint2 \
            xterm \
            novnc \
            python3-websockify \
            curl \
            ca-certificates \
            openssl \
            netcat-openbsd

          sudo curl -fsSL \
            -o /usr/local/bin/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64

          sudo chmod +x /usr/local/bin/cloudflared

      - name: Start virtual display and desktop
        shell: bash
        env:
          RESOLUTION: ${{ inputs.resolution }}
        run: |
          set -Eeuo pipefail

          Xvfb "$DISPLAY" \
            -screen 0 "${RESOLUTION}x24" \
            -nolisten tcp \
            > "$RUNNER_TEMP/xvfb.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/xvfb.pid"

          DISPLAY_READY=false
          for i in {1..30}; do
            if xdpyinfo -display "$DISPLAY" >/dev/null 2>&1; then
              DISPLAY_READY=true
              break
            fi
            sleep 1
          done

          if [[ "$DISPLAY_READY" != true ]]; then
            echo "::error::Xvfb لم يبدأ."
            cat "$RUNNER_TEMP/xvfb.log"
            exit 1
          fi

          openbox > "$RUNNER_TEMP/openbox.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/openbox.pid"

          sleep 2

          tint2 > "$RUNNER_TEMP/tint2.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/tint2.pid"

          xterm \
            -fa Monospace \
            -fs 11 \
            -bg "#1e2433" \
            -fg "#e0e6f0" \
            -title "Cloud Desktop Terminal" \
            -geometry 110x32+30+60 \
            > "$RUNNER_TEMP/xterm.log" 2>&1 &

      - name: Start VNC server
        shell: bash
        run: |
          set -Eeuo pipefail

          VNC_PASS="$(openssl rand -hex 4)"
          echo "VNC_PASS=$VNC_PASS" >> "$GITHUB_ENV"

          x11vnc \
            -display "$DISPLAY" \
            -passwd "$VNC_PASS" \
            -rfbport 5900 \
            -localhost \
            -forever \
            -shared \
            -noxdamage \
            -quiet \
            > "$RUNNER_TEMP/x11vnc.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/x11vnc.pid"

          VNC_READY=false
          for i in {1..30}; do
            if nc -z 127.0.0.1 5900; then
              VNC_READY=true
              break
            fi
            sleep 1
          done

          if [[ "$VNC_READY" != true ]]; then
            echo "::error::خادم VNC لم يبدأ."
            cat "$RUNNER_TEMP/x11vnc.log"
            exit 1
          fi

      - name: Start noVNC
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -f /usr/share/novnc/vnc.html ]]; then
            echo "::error::لم يتم العثور على ملفات noVNC في /usr/share/novnc."
            ls -la /usr/share/novnc || true
            exit 1
          fi

          websockify \
            --web=/usr/share/novnc \
            6080 127.0.0.1:5900 \
            > "$RUNNER_TEMP/websockify.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/websockify.pid"

          NOVNC_READY=false
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:6080/vnc.html >/dev/null; then
              NOVNC_READY=true
              break
            fi

            if ! kill -0 "$(cat "$RUNNER_TEMP/websockify.pid")" 2>/dev/null; then
              echo "::error::websockify توقف أثناء التشغيل."
              cat "$RUNNER_TEMP/websockify.log"
              exit 1
            fi

            sleep 1
          done

          if [[ "$NOVNC_READY" != true ]]; then
            echo "::error::noVNC لم يبدأ على المنفذ 6080."
            cat "$RUNNER_TEMP/websockify.log"
            exit 1
          fi

      - name: Open tunnel
        shell: bash
        run: |
          set -Eeuo pipefail

          cloudflared tunnel \
            --no-autoupdate \
            --url http://127.0.0.1:6080 \
            > "$RUNNER_TEMP/cloudflared.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/cloudflared.pid"

          PUBLIC_URL=""
          for i in {1..60}; do
            PUBLIC_URL="$(
              grep -Eo 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' \
                "$RUNNER_TEMP/cloudflared.log" \
                | head -n 1 || true
            )"

            if [[ -n "$PUBLIC_URL" ]]; then
              break
            fi
            sleep 2
          done

          if [[ -z "$PUBLIC_URL" ]]; then
            echo "::error::لم يتم إنشاء رابط Cloudflare."
            cat "$RUNNER_TEMP/cloudflared.log"
            exit 1
          fi

          TUNNEL_READY=false
          for i in {1..20}; do
            if curl -fsS --max-time 10 \
              "$PUBLIC_URL/vnc.html" >/dev/null; then
              TUNNEL_READY=true
              break
            fi
            sleep 3
          done

          if [[ "$TUNNEL_READY" != true ]]; then
            echo "::error::الرابط أُنشئ لكن تعذر الوصول إليه."
            cat "$RUNNER_TEMP/cloudflared.log"
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "Cloud Desktop جاهز"
          echo "افتح الرابط التالي في المتصفح:"
          echo "$PUBLIC_URL/vnc.html"
          echo ""
          echo "VNC password: $VNC_PASS"
          echo "Username: اتركه فارغًا"
          echo "========================================"

          {
            echo "## Cloud Desktop جاهز"
            echo ""
            echo "افتح الرابط في المتصفح:"
            echo ""
            echo "$PUBLIC_URL/vnc.html"
            echo ""
            echo "كلمة مرور VNC: \`$VNC_PASS\`"
            echo ""
            echo "اسم المستخدم: اتركه فارغًا."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep session alive
        shell: bash
        env:
          DURATION: ${{ inputs.duration }}
        run: |
          case "$DURATION" in
            1h) sleep 3600 ;;
            3h) sleep 10800 ;;
            5h) sleep 18000 ;;
            *)
              echo "::error::مدة غير مدعومة."
              exit 1
              ;;
          esac

      - name: Show logs if workflow fails
        if: failure()
        shell: bash
        run: |
          for log in \
            "$RUNNER_TEMP/xvfb.log" \
            "$RUNNER_TEMP/openbox.log" \
            "$RUNNER_TEMP/x11vnc.log" \
            "$RUNNER_TEMP/websockify.log" \
            "$RUNNER_TEMP/cloudflared.log"
          do
            if [[ -f "$log" ]]; then
              echo "===== $log ====="
              cat "$log"
            fi
          done

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          for file in "$RUNNER_TEMP"/*.pid; do
            [[ -f "$file" ]] || continue
            kill "$(cat "$file")" 2>/dev/null || true
          done

          pkill -x cloudflared 2>/dev/null || true
          pkill -x websockify 2>/dev/null || true
          pkill -x x11vnc 2>/dev/null || true
          pkill -x tint2 2>/dev/null || true
          pkill -x openbox 2>/dev/null || true
          pkill -x Xvfb 2>/dev/null || true
