name: CloudLab Linux RDP

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "Session duration"
        required: true
        type: choice
        options:
          - "1h"
          - "3h"
          - "5h40m"
        default: "3h"

permissions:
  contents: read

jobs:
  linux-rdp:
    name: XFCE4 over RDP (Xorg)
    runs-on: ubuntu-latest
    timeout-minutes: 345

    steps:
      - name: Install XFCE4, XRDP and Xorg backend
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "${RDP_PASSWORD:-}" || ${#RDP_PASSWORD} -lt 16 ]]; then
            echo "::error::Add repository Actions secret RDP_PASSWORD with at least 16 characters."
            exit 1
          fi
          sudo apt-get update -qq
          
          # إضافة xfce4-session صراحة لضمان وجود حزم الجلسة
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            xfce4 xfce4-session xfce4-terminal xrdp xorgxrdp dbus-x11 xauth x11-xserver-utils \
            curl ca-certificates openssl
          sudo adduser xrdp ssl-cert || true

          RDP_USER="cloudlab"
          RDP_PASS="$RDP_PASSWORD"
          if id "$RDP_USER" >/dev/null 2>&1; then
            sudo userdel -r "$RDP_USER" || true
          fi
          sudo useradd -m -s /bin/bash "$RDP_USER"
          echo "$RDP_USER:$RDP_PASS" | sudo chpasswd
          sudo usermod -aG ssl-cert "$RDP_USER"

          # استبدال ملف بدء جلسة XRDP الافتراضي بالكامل لفرض إعدادات XFCE4 الصحيحة
          cat << 'EOF' | sudo tee /etc/xrdp/startwm.sh
          #!/bin/sh
          if [ -r /etc/default/locale ]; then
            . /etc/default/locale
            export LANG LANGUAGE
          fi
          export XDG_SESSION_DESKTOP=xfce
          export XDG_CURRENT_DESKTOP=XFCE
          export XDG_CONFIG_DIRS=/etc/xdg:/etc
          exec dbus-launch --exit-with-session startxfce4
          EOF
          sudo chmod +x /etc/xrdp/startwm.sh

          # إزالة إعدادات VNC تماماً من XRDP لجعل Xorg الخيار الوحيد والإجباري
          sudo sed -i '/\[Xvnc\]/,/\[vnc-any\]/d' /etc/xrdp/xrdp.ini

          sudo systemctl enable xrdp
          sudo systemctl restart xrdp
          sleep 3
          sudo ss -lntp | grep ':3389' || {
            echo "::error::XRDP did not open TCP port 3389."
            sudo journalctl -u xrdp --no-pager -n 80 || true
            exit 1
          }

          echo "::add-mask::$RDP_PASS"
          {
            echo "RDP_USER=$RDP_USER"
            echo "RDP_PASS=$RDP_PASS"
          } >> "$GITHUB_ENV"

      - name: Connect runner to Tailscale
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "${TAILSCALE_AUTH_KEY:-}" ]]; then
            echo "::error::Add the repository Actions secret TAILSCALE_AUTH_KEY first."
            exit 1
          fi

          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up \
            --authkey="$TAILSCALE_AUTH_KEY" \
            --hostname="cloudlab-linux-rdp-${GITHUB_RUN_ID}" \
            --accept-dns=false \
            --accept-routes=false

          TAILSCALE_IP=""
          for attempt in {1..30}; do
            TAILSCALE_IP="$(sudo tailscale ip -4 | head -n 1 || true)"
            [[ -n "$TAILSCALE_IP" ]] && break
            sleep 2
          done
          if [[ -z "$TAILSCALE_IP" ]]; then
            echo "::error::Could not obtain the Tailscale IPv4 address."
            exit 1
          fi
          echo "TAILSCALE_IP=$TAILSCALE_IP" >> "$GITHUB_ENV"

      - name: Show connection details
        shell: bash
        run: |
          {
            echo "## CloudLab Linux RDP"
            echo
            echo "- Address: \`$TAILSCALE_IP\`"
            echo "- Port: \`3389\`"
            echo "- Username: \`$RDP_USER\`"
            echo "- Password: use the repository Actions secret RDP_PASSWORD"
            echo "- Session: **Xorg**"
            echo
            echo "Connect only while your device is logged into the same Tailscale network."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "CloudLab Linux RDP is ready. Connection details are in the run summary."

      - name: Keep session alive
        shell: bash
        run: |
          case "${{ inputs.duration }}" in
            1h) sleep 3600 ;;
            3h) sleep 10800 ;;
            5h40m) sleep 20400 ;;
            *) echo "::error::Invalid duration"; exit 1 ;;
          esac

      - name: Diagnostics
        if: failure()
        shell: bash
        run: |
          sudo ss -lntp | grep -E '3389|22' || true
          sudo journalctl -u xrdp --no-pager -n 100 || true
          sudo journalctl -u xrdp-sesman --no-pager -n 100 || true
          sudo tail -n 100 /var/log/xrdp.log /var/log/xrdp-sesman.log 2>/dev/null || true

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          sudo tailscale down || true
          sudo systemctl stop xrdp || true
          sudo userdel cloudlab 2>/dev/null || true
          sudo rm -rf /home/cloudlab
