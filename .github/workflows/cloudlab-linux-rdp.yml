name: CloudLab Linux RDP

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "Session duration"
        required: true
        type: choice
        options:
          - "1h"
          - "3h"
          - "5h40m"
        default: "3h"

permissions:
  contents: read

jobs:
  linux-rdp:
    name: XFCE4 over RDP
    runs-on: ubuntu-latest
    timeout-minutes: 345

    steps:
      - name: Install Desktop Environment and XRDP
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          
          # تثبيت الواجهة والأدوات المطلوبة بشكل نظيف
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            xfce4 xfce4-session xfce4-terminal xrdp xorgxrdp dbus-x11 xauth
          
          sudo adduser xrdp ssl-cert || true

          # إنشاء المستخدم
          RDP_USER="cloudlab"
          RDP_PASS="cloudlab"
          
          sudo useradd -m -s /bin/bash "$RDP_USER"
          echo "$RDP_USER:$RDP_PASS" | sudo chpasswd
          sudo usermod -aG sudo "$RDP_USER"

          # تحديد XFCE4 كواجهة افتراضية للمستخدم بطريقة قياسية
          echo "startxfce4" | sudo tee /home/$RDP_USER/.xsession
          sudo chown $RDP_USER:$RDP_USER /home/$RDP_USER/.xsession

          # إزالة خيارات VNC من شاشة الدخول لضمان استخدام Xorg فقط
          sudo sed -i '/\[Xvnc\]/,/\[vnc-any\]/d' /etc/xrdp/xrdp.ini

          sudo systemctl enable xrdp
          sudo systemctl restart xrdp
          sleep 3
          sudo ss -lntp | grep ':3389' || {
            echo "::error::XRDP failed to start."
            exit 1
          }

      - name: Connect runner to Tailscale
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "${TAILSCALE_AUTH_KEY:-}" ]]; then
            echo "::error::Add the repository Actions secret TAILSCALE_AUTH_KEY first."
            exit 1
          fi

          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up \
            --authkey="$TAILSCALE_AUTH_KEY" \
            --hostname="cloudlab-linux-rdp-${GITHUB_RUN_ID}" \
            --accept-dns=false \
            --accept-routes=false

          TAILSCALE_IP=""
          for attempt in {1..30}; do
            TAILSCALE_IP="$(sudo tailscale ip -4 | head -n 1 || true)"
            [[ -n "$TAILSCALE_IP" ]] && break
            sleep 2
          done
          
          if [[ -z "$TAILSCALE_IP" ]]; then
            echo "::error::Could not obtain the Tailscale IPv4 address."
            exit 1
          fi
          echo "TAILSCALE_IP=$TAILSCALE_IP" >> "$GITHUB_ENV"

      - name: Show connection details
        shell: bash
        run: |
          {
            echo "## CloudLab Linux RDP is Ready"
            echo
            echo "- **Address:** \`$TAILSCALE_IP\`"
            echo "- **Username:** \`cloudlab\`"
            echo "- **Password:** \`cloudlab\`"
            echo
            echo "Connect using Windows Remote Desktop. The login screen will only show Xorg."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep session alive
        shell: bash
        run: |
          case "${{ inputs.duration }}" in
            1h) sleep 3600 ;;
            3h) sleep 10800 ;;
            5h40m) sleep 20400 ;;
            *) echo "::error::Invalid duration"; exit 1 ;;
          esac

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          sudo tailscale down || true
          sudo systemctl stop xrdp || true
          sudo userdel -f cloudlab 2>/dev/null || true
          sudo rm -rf /home/cloudlab
