name: CloudLab IPTV Runner

on:
  schedule:
    # 06:00 and 18:00 Dubai time (UTC+4)
    - cron: "0 2,14 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-iptv:
    name: Run iptv.js (maximum 15 minutes)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout CloudLab
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Chromium and Node dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends chromium
          npm install --no-save puppeteer-core

      - name: Run iptv.js for up to 15 minutes
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.IPTV_GITHUB_TOKEN }}
          GITHUB_REPO: ${{ secrets.IPTV_GITHUB_REPO }}
          CHROME_PATH: /usr/bin/chromium
        run: |
          set -Eeuo pipefail
          if [[ ! -f iptv.js ]]; then
            echo "::error::iptv.js is missing from the repository root."
            exit 1
          fi

          echo "Starting iptv.js. The process will be stopped after 15 minutes."
          set +e
          timeout --signal=TERM --kill-after=30s 15m node iptv.js
          status=$?
          set -e

          if [[ "$status" -eq 124 || "$status" -eq 137 ]]; then
            echo "iptv.js reached the 15-minute runtime limit and was stopped."
            exit 0
          fi

          exit "$status"
